<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tài Xỉu Full Mobile</title>
  <button onclick="toggleEffect()" style="margin-top:8px">
  🎨 Hiệu ứng: <span id="fxStatus">BẬT</span>
</button>
<link rel="manifest" href="manifest.json">
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>
<style>
body{font-family:Arial;background:#111;color:#fff;text-align:center;padding:10px}
button{padding:12px;margin:5px;font-size:16px;border-radius:10px;border:none}
.choice{background:#444;color:#fff}
.active{background:#00c853}
.main{background:#ff9800}
.box{background:#222;padding:10px;border-radius:10px;margin:10px 0}
</style>
</head>
<body>
<h2>🎲 TÀI XỈU – APP</h2>
  <button onclick="toggleEffect()" style="margin-top:8px">
  🎨 Hiệu ứng: <span id="fxStatus">BẬT</span>
</button>
<div class="box">
<button class="choice" onclick="pick('TÀI',this)">TÀI</button>
<button class="choice" onclick="pick('XỈU',this)">XỈU</button>
<button class="choice" onclick="pick('NHÀ CÁI',this)">NHÀ CÁI</button>
</div>
<button class="main" onclick="play()">🎲 LẮC</button>
<div class="box" id="out">Chưa có kết quả</div>

<script>
let choice=null;
function r(){return Math.floor(Math.random()*6)+1}
function pick(c,e){
 choice=c;
 document.querySelectorAll(".choice").forEach(b=>b.classList.remove("active"));
 e.classList.add("active");
}
function play(){
 let x=[r(),r(),r()];
 let s=x[0]+x[1]+x[2];
 let k=(s==3||s==18)?"NHÀ CÁI":(s<=10?"XỈU":"TÀI");
 document.getElementById("out").innerHTML=
 `🎲 ${x.join("-")}<br>Tổng: ${s}<br><b>${k}</b><br>Dự đoán: ${choice?(choice==k?"✅":"❌"):"—"}`;
}
</script>
</body>
</html>
