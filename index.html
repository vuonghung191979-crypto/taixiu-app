<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tài Xỉu 3D – Mở Bát</title>
<style>
body{
  margin:0;
  font-family:system-ui;
  background:#020617;
  color:#e5e7eb;
}
.app{
  max-width:480px;
  margin:auto;
  padding:16px;
}
h1{text-align:center;margin:10px 0;}
.card{
  background:#0f172a;
  border-radius:16px;
  padding:16px;
  margin:12px 0;
}
.center{text-align:center;}
.balance{font-size:20px;font-weight:700;}
.small{font-size:12px;color:#94a3b8;margin-top:6px;}
.bot{margin-top:8px;font-size:13px;color:#facc15;}
.row{display:flex;gap:8px;flex-wrap:wrap;}
button{flex:1;padding:14px;border:none;border-radius:14px;font-weight:800;transition:0.3s;}
.bet{background:#1e293b;color:#fff;}
.tai{background:#22c55e;}
.xiu{background:#38bdf8;}
.disabled{opacity:.5;pointer-events:none;}

/* Dice container 3D */
.dice-container{
  position: relative;
  width: 140px;
  height: 140px;
  margin: auto;
  perspective: 600px;
}
.dice{
  position: absolute;
  top:50px;
  left:50px;
  width:40px;
  height:40px;
  font-size:30px;
  display:flex;
  flex-direction:column;
  align-items:center;
  transition: transform 0.3s ease-out;
}
.dice span{
  font-size:14px;
  margin-top:4px;
}

/* Countdown */
.countdown{
  font-size: 14px;
  margin-top: 4px;
  color: #facc15;
}

/* Highlight winner */
.winner{
  text-shadow: 0 0 10px #facc15;
  color: #facc15;
  font-weight: 800;
}
.loser{
  opacity: 0.3;
}

/* Tài/Xỉu hai bên */
#sideOptions{
  display:flex;
  justify-content:space-between;
  margin:12px 0;
  font-size:20px;
}
#sideOptions span{
  width:48%;
  text-align:center;
  padding:6px 0;
  border-radius:12px;
  border:1px solid #94a3b8;
  transition:0.3s;
}
</style>
</head>
<body>

<div class="app">
  <h1>🎲 TÀI XỈU 3D – Mở Bát</h1>

  <div class="card center">
    <div class="balance">Xu: <span id="balance">1,000,000,000</span></div>
    <div class="small">* Giải trí</div>
  </div>

  <div class="card center">
    <div id="sideOptions">
      <span id="sideTai">TÀI</span>
      <span id="sideXiu">XỈU</span>
    </div>
    <div class="dice-container" id="diceContainer">
      <div id="dice1" class="dice"><div>🎲</div><span>—</span></div>
      <div id="dice2" class="dice"><div>🎲</div><span>—</span></div>
      <div id="dice3" class="dice"><div>🎲</div><span>—</span></div>
    </div>
    <div id="countdown" class="countdown">5s</div>
    <div id="result" class="small"></div>
    <div id="bot" class="bot">🤖 Bot dự đoán: chưa có dữ liệu</div>
  </div>

  <div class="card center">
    <div class="row">
      <button id="btnTai" class="tai">TÀI</button>
      <button id="btnXiu" class="xiu">XỈU</button>
    </div>
  </div>

  <div class="card">
    <b>💰 Mức cược</b>
    <div class="row" style="margin-top:8px">
      <button class="bet" data-bet="1000">1K</button>
      <button class="bet" data-bet="10000">10K</button>
      <button class="bet" data-bet="50000">50K</button>
      <button class="bet" data-bet="100000">100K</button>
      <button class="bet" data-bet="500000">500K</button>
      <button class="bet" data-bet="5000000">5M</button>
      <button class="bet" data-bet="50000000">50M</button>
    </div>
    <div class="small">
      Hoặc đặt cược tự do: <input type="number" id="customBet" placeholder="Nhập số xu" style="width:120px;background:#0f172a;color:#fff;border:none;border-radius:6px;padding:4px;">
    </div>
    <div class="small">Đã chọn: <b id="betShow">—</b></div>
  </div>
</div>

<audio id="soundRoll" src="https://freesound.org/data/previews/341/341695_6249637-lq.mp3"></audio>
<audio id="soundWin" src="https://freesound.org/data/previews/458/458545_1022659-lq.mp3"></audio>
<audio id="soundLose" src="https://freesound.org/data/previews/170/170206_2437358-lq.mp3"></audio>

<script>
document.addEventListener("DOMContentLoaded",()=>{

  let balance = 1000000000;
  let bet = 0;
  let choice = null;
  let rolling = false;
  const $ = id=>document.getElementById(id);
  const btnTai = $("btnTai");
  const btnXiu = $("btnXiu");
  const diceElems = ["dice1","dice2","dice3"].map(id=>$ (id));
  const sideTai = $("sideTai");
  const sideXiu = $("sideXiu");
  const customBet = $("customBet");
  const botDisplay = $("bot");

  const soundRoll = $("soundRoll");
  const soundWin = $("soundWin");
  const soundLose = $("soundLose");

  function setBet(v){
    bet=v;
    $("betShow").innerText=v.toLocaleString();
  }

  function botPrediction(){
    const ratioTai = 0.7;
    return Math.random()<ratioTai?"TAI":"XIU";
  }

  function choose(c){
    if(rolling) return;
    let custom = Number(customBet.value);
    if(custom>0){
      bet = custom;
      $("betShow").innerText = bet.toLocaleString();
    }
    if(!bet || bet>balance){
      alert("Chọn mức cược hợp lệ");
      return;
    }
    choice = c;
    startRoll();
  }

  function startRoll(){
    rolling = true;
    $("result").innerText="Đang quay...";
    const botChoice = botPrediction();
    botDisplay.innerText = `🤖 Bot dự đoán: ${botChoice}`;

    btnTai.classList.remove("winner","loser");
    btnXiu.classList.remove("winner","loser");
    sideTai.classList.remove("winner","loser");
    sideXiu.classList.remove("winner","loser");
    sideTai.style.opacity=sideXiu.style.opacity=1;

    // reset vị trí xúc xắc
    diceElems.forEach(d=>{
      d.style.transform="translate(0,0) rotateX(0deg) rotateY(0deg)";
      d.querySelector("span").innerText="—";
    });

    soundRoll.currentTime=0;
    soundRoll.play();

    let countdown = $("countdown");
    let seconds = 5;
    let interval = setInterval(()=>{
      seconds--;
      countdown.innerText=`${seconds}s`;

      // di chuyển random
      diceElems.forEach(d=>{
        let rx=Math.random()*720;
        let ry=Math.random()*720;
        let tx=Math.random()*80-40;
        let ty=Math.random()*80-40;
        d.style.transform=`translate(${tx}px,${ty}px) rotateX(${rx}deg) rotateY(${ry}deg)`;
      });

      if(seconds<=0){
        clearInterval(interval);
        finishRoll();
      }
    },200);
  }

  function finishRoll(){
    soundRoll.pause();
    let values = [1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)];
    let total = values[0]+values[1]+values[2];
    let rs = total>=11?"TAI":"XIU";

    // xếp tam giác
    const positions = [
      {x:0, y:-30}, // top
      {x:-30, y:30}, // bottom-left
      {x:30, y:30} // bottom-right
    ];
    diceElems.forEach((d,i)=>{
      d.querySelector("div").innerText="🎲";
      d.querySelector("span").innerText=values[i];
      d.style.transform=`translate(${positions[i].x}px,${positions[i].y}px) rotateX(0deg) rotateY(0deg)`;
    });

    $("result").innerText=`Tổng ${total} → ${rs==="TAI"?"TÀI":"XỈU"}`;

    if(rs===choice){
      balance+=bet*2;
      soundWin.currentTime=0; soundWin.play();
    } else {
      balance-=bet;
      soundLose.currentTime=0; soundLose.play();
    }
    $("balance").innerText=balance.toLocaleString();

    if(rs==="TAI"){
      btnTai.classList.add("winner");
      btnXiu.classList.add("loser");
      sideTai.classList.add("winner");
      sideXiu.classList.add("loser");
    } else {
      btnXiu.classList.add("winner");
      btnTai.classList.add("loser");
      sideXiu.classList.add("winner");
      sideTai.classList.add("loser");
    }

    rolling=false;
    choice=null;
    $("countdown").innerText="";
    customBet.value="";
  }

  btnTai.addEventListener("click",()=>choose("TAI"));
  btnXiu.addEventListener("click",()=>choose("XIU"));
  document.querySelectorAll(".bet").forEach(btn=>btn.addEventListener("click",()=>setBet(Number(btn.dataset.bet))));
});
</script>
</body>
</html>
