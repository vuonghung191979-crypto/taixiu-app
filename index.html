<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tài Xỉu VIP 2026 – Mở Bát</title>
<style>
body{margin:0;font-family:sans-serif;background:#111;color:#fff;}
.app{max-width:600px;margin:0 auto;min-height:100vh;padding:10px;position:relative;}
.top-bar{display:flex;justify-content:space-between;padding:10px;background:rgba(0,0,0,0.6);border-bottom:2px solid gold;font-weight:bold;}
.bead-road{display:flex;gap:4px;overflow-x:auto;padding:5px;background:rgba(0,0,0,0.3);margin:5px 0;border-radius:20px;align-items:center;height:24px;}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.dot.tai{background:gold;border:1px solid #fff;}
.dot.xiu{background:#fff;border:1px solid #fff;}
.game-board{position:relative;margin-top:20px;}
.board-frame{background:rgba(0,0,0,0.6);border:2px solid gold;border-radius:40px;padding:10px;}
.session-info{text-align:center;font-size:12px;color:#aaa;margin-bottom:5px;}
.main-display{display:flex;justify-content:space-between;align-items:center;position:relative;height:220px;}
.gate{width:32%;text-align:center;display:flex;flex-direction:column;justify-content:center;height:100%;transition:0.3s;}
.gate-title{font-size:42px;font-weight:900;text-shadow:0 2px 0 #000;}
.gate-tai .gate-title{color:gold;}
.gate-xiu .gate-title{color:#fff;}
.gate.winner .gate-title{text-shadow:0 0 20px #fff,0 0 40px gold;filter:brightness(1.5);}
.gate.loser{opacity:0.3;filter:grayscale(1);}
.bowl-container{width:140px;height:140px;background:radial-gradient(circle at 30% 30%,#4a0e0e,#000);border-radius:50%;border:4px solid gold;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;justify-content:center;align-items:center;perspective:600px;z-index:10;}
.dice-wrap{position:relative;width:80px;height:80px;}
.dice{position:absolute;width:36px;height:36px;background:#fff;border-radius:6px;display:flex;justify-content:center;align-items:center;font-size:24px;font-weight:bold;color:#d00;transition:transform 0.3s ease-out;}
.countdown-circle{position:absolute;top:-15px;background:#000;border:2px solid gold;color:gold;width:30px;height:30px;border-radius:50%;display:flex;justify-content:center;align-items:center;font-weight:bold;font-size:14px;z-index:20;}
.total-score{position:absolute;bottom:-15px;background:#d00;color:#fff;padding:2px 10px;border-radius:10px;font-weight:bold;font-size:12px;border:1px solid #fff;display:none;}
.cover-circle{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;background:rgba(0,0,0,0.9);display:flex;justify-content:center;align-items:center;color:#fff;font-weight:bold;font-size:14px;cursor:pointer;z-index:50;transition:0.3s;}
.control-panel{margin-top:15px;}
.status-text{text-align:center;color:gold;font-style:italic;margin-bottom:10px;height:20px;}
.money-bar{background:#000;border:1px solid gold;padding:8px 15px;border-radius:20px;display:flex;justify-content:space-between;font-weight:bold;color:gold;font-size:18px;margin-bottom:15px;}
.btn{padding:6px 10px;background:gold;color:#111;border:none;border-radius:6px;cursor:pointer;font-weight:bold;margin-top:5px;}
</style>
</head>
<body>
<div class="app">
    <div class="top-bar">VMH <span>TK: User_9999</span></div>
    <div class="bead-road" id="beadRoad"><span style="font-size:10px;color:#aaa;margin-right:5px;">CẦU:</span></div>
    <div class="game-board">
        <div class="board-frame">
            <div class="session-info">PHIÊN #<span id="sessionID">1</span></div>
            <div class="main-display">
                <div class="gate gate-tai" id="areaTai"><div class="gate-title">TÀI</div></div>
                <div class="bowl-container">
                    <div class="countdown-circle" id="countdown">60</div>
                    <div class="dice-wrap" id="diceWrap">
                        <div id="dice1" class="dice">?</div>
                        <div id="dice2" class="dice">?</div>
                        <div id="dice3" class="dice">?</div>
                    </div>
                    <div class="total-score" id="scoreLabel">10</div>
                    <div class="cover-circle" id="coverCircle">Mở ngay!<br><button class="btn" id="btnSkip">Bỏ qua</button></div>
                </div>
                <div class="gate gate-xiu" id="areaXiu"><div class="gate-title">XỈU</div></div>
            </div>
        </div>
    </div>
    <div class="control-panel">
        <div class="status-text" id="statusText">Tự động chơi VIP</div>
        <div class="money-bar">SỐ DƯ:<span id="balanceDisplay">1.000.000.000.000</span> VNĐ</div>
    </div>
</div>

<audio id="sfxRoll" src="https://freesound.org/data/previews/341/341695_6249637-lq.mp3"></audio>
<audio id="sfxWin" src="https://freesound.org/data/previews/170/170169_2578041-lq.mp3"></audio>

<script>
let balance = 1000000000000;
let diceChars=["⚀","⚁","⚂","⚃","⚄","⚅"];
const el=id=>document.getElementById(id);
const diceElems=[el('dice1'),el('dice2'),el('dice3')];
let isRolling=false;

updateBalance();
startAutoGame();

function updateBalance(){ el('balanceDisplay').innerText=balance.toLocaleString('vi-VN'); }
function addHistoryDot(type){ let d=document.createElement('div'); d.className='dot '+type.toLowerCase(); el('beadRoad').appendChild(d); el('beadRoad').scrollLeft=el('beadRoad').scrollWidth; }

function startAutoGame(){ runRound(); setInterval(runRound,70000); }

function runRound(){
    if(isRolling) return;
    isRolling=true;
    el('statusText').innerText='Đang quay phiên mới...';
    el('scoreLabel').style.display='none';
    el('coverCircle').style.display='none';
    let timeLeft=60; el('countdown').innerText=timeLeft;
    el('sfxRoll').currentTime=0; el('sfxRoll').play();

    let interval=setInterval(()=>{
        timeLeft--;
        el('countdown').innerText=timeLeft;
        diceElems.forEach(d=>{
            d.innerText=diceChars[Math.floor(Math.random()*6)];
            let x=Math.random()*20-10; let y=Math.random()*20-10;
            d.style.transform=`translate(${x}px,${y}px) rotate(${Math.random()*360}deg)`;
        });
        if(timeLeft<=0){ clearInterval(interval); showCover(); }
    },1000);
}

function showCover(){
    // Che kết quả 5s
    el('coverCircle').style.display='flex';
    let coverTime=5;
    let coverInterval=setInterval(()=>{
        coverTime--;
        if(coverTime<=0){ clearInterval(coverInterval); revealResult(); }
    },1000);
}

// Mở khi click
el('coverCircle').addEventListener('click',revealResult);
el('btnSkip').addEventListener('click',()=>{ revealResult(); });

function revealResult(){
    el('coverCircle').style.display='none';
    let results=[1,2,3].map(()=>Math.floor(Math.random()*6)+1);
    let total=results.reduce((a,b)=>a+b,0);
    let resultType=total>=11?'TAI':'XIU';
    const pos=[{x:0,y:-20},{x:-20,y:15},{x:20,y:15}];
    diceElems.forEach((d,i)=>{
        d.innerText=diceChars[results[i]-1];
        d.style.transform=`translate(${pos[i].x}px,${pos[i].y}px) rotate(0deg)`;
    });
    el('scoreLabel').innerText=total; el('scoreLabel').style.display='block';
    addHistoryDot(resultType);
    el('statusText').innerText=`Kết quả: ${resultType} - Tổng: ${total} | Phiên mới sau 10s`;
    isRolling=false;
    el('sessionID').innerText=Number(el('sessionID').innerText)+1;
}
</script>
</body>
</html>
