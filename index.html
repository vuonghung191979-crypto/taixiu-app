<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tài Xỉu – Giải trí</title>

<style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#e5e7eb}
.app{max-width:420px;margin:auto;padding:16px}
h1{text-align:center}
.card{background:#111827;border-radius:14px;padding:16px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{padding:10px;border-radius:10px;border:none;font-weight:700}
.green{background:#22c55e}
.blue{background:#38bdf8}
.gray{background:#334155;color:#fff}
.orange{background:#f59e0b}
.bet{background:#1e293b;color:#fff}
.center{text-align:center}
.dice{font-size:36px}
.flash{animation:f .5s}@keyframes f{0%{opacity:.2}100%{opacity:1}}
input{width:100%;padding:10px;border-radius:10px;border:1px solid #334155;background:#020617;color:#fff}
.small{font-size:12px;color:#94a3b8;margin-top:4px}
</style>
</head>

<body>
<div class="app">
<h1>🎲 Tài Xỉu (Giải trí)</h1>

<div class="card center">
Xu giải trí: <b id="balance">1000000</b>
<div class="small">* Không tiền thật</div>
</div>

<div class="card center">
<div id="result" class="dice">—</div>
<div id="sum" class="small"></div>
<div id="botNext" class="small">🔮 Bot dự đoán: chưa có dữ liệu</div>
</div>

<div class="card">
<b>💰 Chọn mức cược</b>
<div class="row" style="margin-top:8px">
<button class="bet" onclick="setBet(1000)">1K</button>
<button class="bet" onclick="setBet(10000)">10K</button>
<button class="bet" onclick="setBet(50000)">50K</button>
<button class="bet" onclick="setBet(100000)">100K</button>
<button class="bet" onclick="setBet(500000)">500K</button>
<button class="bet" onclick="setBet(5000000)">5M</button>
<button class="bet" onclick="setBet(50000000)">50M</button>
</div>
<input id="betAmount" type="number" placeholder="Hoặc nhập cược tự do">
</div>

<div class="card">
<div class="row">
<button class="green" style="flex:1" onclick="choose('TAI')">TÀI</button>
<button class="blue" style="flex:1" onclick="choose('XIU')">XỈU</button>
</div>
</div>

<div class="card">
<div class="row">
<button class="gray" style="flex:1" onclick="roll()">🎲 LẮC</button>
<button class="orange" style="flex:1" onclick="resetGame()">↺ Reset</button>
</div>
</div>
</div>

<audio id="sound" src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="></audio>

<script>
let balance=1000000;
let choice=null;
let history=[];

const $=id=>document.getElementById(id);

function setBet(v){
  betAmount.value=v;
}

function choose(c){
  choice=c;
  alert("Bạn chọn " + (c==="TAI"?"TÀI":"XỈU"));
}

function roll(){
  let bet=+betAmount.value;
  if(!choice || bet<=0 || bet>balance){
    alert("Cược không hợp lệ");
    return;
  }

  let d1=Math.ceil(Math.random()*6);
  let d2=Math.ceil(Math.random()*6);
  let d3=Math.ceil(Math.random()*6);
  let total=d1+d2+d3;
  let rs=total>=11?"TAI":"XIU";

  history.push(rs);
  if(history.length>20) history.shift();
  predictNext();

  $("sound").play().catch(()=>{});

  result.classList.remove("flash");
  void result.offsetWidth;
  result.classList.add("flash");

  result.innerText="🎲🎲🎲";
  setTimeout(()=>{
    result.innerText=`${d1} ${d2} ${d3}`;
    sum.innerText=`Tổng ${total} → ${rs==="TAI"?"TÀI":"XỈU"}`;
    balance+=choice===rs?bet:-bet;
    $("balance").innerText=balance;
    choice=null;
  },400);
}

function predictNext(){
  if(history.length<5){
    botNext.innerText="🔮 Bot dự đoán: cần thêm dữ liệu";
    return;
  }
  let recent=history.slice(-5);
  let tai=recent.filter(x=>x==="TAI").length;
  let xiu=recent.filter(x=>x==="XIU").length;
  let predict=tai>xiu?"TÀI":"XỈU";
  let rate=Math.round(Math.max(tai,xiu)/recent.length*100);
  botNext.innerText=`🔮 Bot dự đoán ván tới: ${predict} (${rate}%)`;
}

function resetGame(){
  balance=1000000;
  history=[];
  $("balance").innerText=balance;
  result.innerText="—";
  sum.innerText="";
  botNext.innerText="🔮 Bot dự đoán: chưa có dữ liệu";
}
</script>
</body>
</html>
